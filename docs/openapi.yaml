openapi: 3.1.0
info:
  title: api-gateway control plane
  version: 0.1.0
  description: |
    Administrative API for the gateway. Served on `ADMIN_BIND` (default
    `127.0.0.1:9090`) and only when `ADMIN_TOKEN` or `ADMIN_TOKENS` is set. Every operation is
    also available through the `api-gateway admin` CLI, which uses the same
    service layer.

    Mutations take effect on the data plane without a restart: the route table
    version counter changes and each replica swaps its snapshot within
    `ROUTE_REFRESH_INTERVAL_MS`.
servers:
  - url: http://127.0.0.1:9090
security:
  - adminToken: []
tags:
  - name: tenants
  - name: clients
  - name: keys
  - name: upstreams
  - name: routes
  - name: audit

paths:
  /healthz:
    get:
      summary: Liveness of the control-plane listener
      description: Requires an admin token like every other path on this listener.
      responses:
        "200":
          description: Listening

  /v1/tenants:
    post:
      tags: [tenants]
      summary: Create a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  example: acme
      responses:
        "201":
          description: Created
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/tenants/{id}:
    delete:
      tags: [tenants]
      summary: Delete a tenant
      description: Fails with 409 while clients or tenant-bound routes still reference it.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/clients:
    post:
      tags: [clients]
      summary: Create a client inside a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, tenant_id]
              properties:
                id:
                  type: string
                tenant_id:
                  type: string
      responses:
        "201":
          description: Created
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/clients/{id}:
    delete:
      tags: [clients]
      summary: Delete a client
      description: Fails with 409 while API keys still reference it.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/keys:
    post:
      tags: [keys]
      summary: Issue an API key
      description: The `token` is returned exactly once and never again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                expires_in_days:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [keys]
      summary: List a client's keys (never returns tokens)
      description: |
        Newest first. Pages are keyset-based: pass `next_cursor` back as
        `cursor`. A key issued or revoked between pages cannot shift the page
        boundary.
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/keys/{key_id}:
    delete:
      tags: [keys]
      summary: Revoke a key
      description: Takes effect immediately for this process; other processes are bounded by `AUTH_CACHE_TTL_SECS`.
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/keys/{key_id}/rotate:
    post:
      tags: [keys]
      summary: Replace a key with an equivalent one
      description: |
        Issues a new key with the same client, scopes, and remaining lifetime,
        then revokes the old one. Refuses keys that are already revoked.
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          description: Replacement issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/upstreams:
    get:
      tags: [upstreams]
      summary: List upstreams
      description: Ordered by id. Pass `next_cursor` back as `cursor` for the next page.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of upstreams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/upstreams/{id}:
    put:
      tags: [upstreams]
      summary: Register or update an upstream
      description: The host must pass `UPSTREAM_ALLOW_HOSTS` when that list is set.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url]
              properties:
                base_url:
                  type: string
                  format: uri
                  example: https://billing.internal
                timeout_ms:
                  type: integer
                  default: 10000
                  minimum: 1
                  maximum: 300000
                audience:
                  type: [string, "null"]
                  description: |
                    RFC 8693 audience for the exchanged upstream token. Requires
                    `OAUTH_TOKEN_ENDPOINT` and its client credentials.
                exchange_scope:
                  type: [string, "null"]
                  description: Optional scope requested during exchange.
      responses:
        "204":
          description: Stored
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [upstreams]
      summary: Delete an upstream
      description: Fails with 409 while routes still reference it.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/routes:
    get:
      tags: [routes]
      summary: List routes
      description: Ordered by path prefix, then id. Pass `next_cursor` back as `cursor`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/audit:
    get:
      tags: [audit]
      summary: Read the control-plane audit trail
      description: |
        Most recent first. Same page contract as the resource listings: pass
        `next_cursor` back as `cursor`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of events, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/data-audit:
    get:
      tags: [audit]
      summary: Read per-call data-plane audit events
      description: |
        Requires `audit:read`. Rows carry identifiers and decisions, never
        payloads, tokens, or verifier material.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: RFC 3339 lower bound on occurred_at.
        - name: tenant
          in: query
          schema:
            type: string
      responses:
        "200":
          description: One page of calls, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataAuditList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/routes/{id}:
    put:
      tags: [routes]
      summary: Register or update a route
      description: |
        The matched prefix is stripped before forwarding unless `rewrite_prefix`
        supplies a replacement. A prefix+method pair may be claimed by only one
        route.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path_prefix, upstream_id, methods]
              description: |
                Omitted optional fields preserve the stored value; an explicit empty
                string/array/`0` clears the field. `tenant_id`, `scopes`, and
                `tool_policy` are security fields and are never cleared by omission.
              properties:
                path_prefix:
                  type: string
                  example: /v1/billing
                methods:
                  type: array
                  items:
                    type: string
                  example: [GET, POST]
                upstream_id:
                  type: string
                rewrite_prefix:
                  type: string
                  example: /billing
                tenant_id:
                  type: [string, "null"]
                  description: Bind the route to one tenant; omit for a shared route.
                scopes:
                  type: array
                  items:
                    type: string
                tool_policy:
                  $ref: "#/components/schemas/ToolPolicy"
                request_timeout_ms:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 3600000
                  description: |
                    Per-route deadline; 0 clears it to the default. The effective
                    value is bounded by `MAX_REQUEST_TIMEOUT_SECS` (300 s default).
                max_response_bytes:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 1073741824
                  description: Per-route response cap; 0 means unlimited (for streams).
                enabled:
                  type: boolean
                  default: true
                priority:
                  type: integer
                  default: 0
                  description: Higher wins between routes with the same prefix.
      responses:
        "204":
          description: Stored
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [routes]
      summary: Delete a route
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: |
        One of the `ADMIN_TOKENS` values (`name:token[:scope+scope]`). The name is
        recorded as the actor for every mutation; the scopes decide what the token may
        do. `ADMIN_TOKEN` also works, maps to `admin`, and grants every scope.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size. A value outside the range is a 400, never a silent clamp.
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque `next_cursor` from the previous page. Omit it to start at the
        beginning. Cursors are not offsets and must not be constructed by a
        client; an invalid one is a 400.
      schema:
        type: string

  schemas:
    IssuedKey:
      type: object
      required: [key_id, token, scopes]
      properties:
        key_id:
          type: string
        token:
          type: string
          description: Shown once. Format `<key_id>.<secret>`; send as a bearer token.
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: [string, "null"]
    KeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KeySummary"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; null when the listing ends.
    KeySummary:
      type: object
      required: [key_id, client_id, scopes, created_at]
      properties:
        key_id:
          type: string
        client_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
        expires_at:
          type: [string, "null"]
        revoked_at:
          type: [string, "null"]
    UpstreamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Upstream"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; null when the listing ends.
    Upstream:
      type: object
      required: [id, base_url, timeout_ms]
      properties:
        id:
          type: string
        base_url:
          type: string
        timeout_ms:
          type: integer
        audience:
          type: [string, "null"]
        exchange_scope:
          type: [string, "null"]
    RouteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; null when the listing ends.
    Route:
      type: object
      required: [id, path_prefix, methods, upstream_id]
      properties:
        id:
          type: string
        path_prefix:
          type: string
        methods:
          type: array
          items:
            type: string
        upstream_id:
          type: string
        rewrite_prefix:
          type: [string, "null"]
        tenant_id:
          type: [string, "null"]
        scopes:
          type: array
          items:
            type: string
        tool_policy:
          $ref: "#/components/schemas/ToolPolicy"
        request_timeout_ms:
          type: [integer, "null"]
        max_response_bytes:
          type: [integer, "null"]
        enabled:
          type: boolean
        priority:
          type: integer
    ToolPolicy:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [off, allow_list]
          description: |
            `off` does not inspect MCP bodies. `allow_list` enforces the role map
            and filters `tools/list`.
        roles:
          type: object
          description: |
            Role name to tool names. `*` as a role matches every caller; `*` as a
            tool name allows every tool for that role.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            support: [search_tickets]
            admin: ["*"]
    DataAuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataAuditEntry"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; null when the listing ends.
    DataAuditEntry:
      type: object
      required: [occurred_at, tenant_id, auth_method, decision]
      properties:
        occurred_at:
          type: string
        tenant_id:
          type: string
        subject:
          type: [string, "null"]
        assistant:
          type: [string, "null"]
        auth_method:
          type: string
          enum: [api_key, oauth]
        mcp_method:
          type: [string, "null"]
        route_id:
          type: [string, "null"]
        tool_name:
          type: [string, "null"]
        decision:
          type: string
          enum: [allow, deny]
        status:
          type: [integer, "null"]
        latency_ms:
          type: [integer, "null"]
        request_id:
          type: [string, "null"]
        token_id:
          type: [string, "null"]
        detail:
          type: object
          description: |
            Configured token claims (`AUDIT_CLAIMS`) and the caller's `X-Run-Id`.
            Identifiers only, never payloads.
          additionalProperties: true
    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; null when the listing ends.
    AuditEntry:
      type: object
      required: [occurred_at, actor, action, subject]
      properties:
        occurred_at:
          type: string
        actor:
          type: string
          description: Name bound to the admin token that made the change.
        action:
          type: string
          example: route.put
        subject:
          type: string
          example: billing-v1
        source_ip:
          type: [string, "null"]
        request_id:
          type: [string, "null"]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
            request_id:
              type: [string, "null"]
              description: Present when the failure happened inside an HTTP request.

  responses:
    Unauthorized:
      description: Missing or invalid admin token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The admin token does not hold the required scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Already exists or not in the required state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
