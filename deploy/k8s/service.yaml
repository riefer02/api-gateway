apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Scrape /metrics from inside the cluster only. Point Prometheus at this
# service; it is not exposed through the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-metrics
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: metrics
      port: 8080
      targetPort: http
---
# Control plane. Restrict who can reach it with the NetworkPolicy; it is never
# exposed through the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-admin
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: admin
      port: 9090
      targetPort: admin
