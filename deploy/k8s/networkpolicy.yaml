# Default-deny, then allow exactly what the gateway needs.
#
# Adjust the namespace labels and ports to your cluster before applying;
# upstream egress depends on where your services live.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    # Data plane: the ingress controller and monitoring may scrape it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    # Admin listener: operators only. Never allow the ingress namespace here.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-gateway-operators
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Postgres
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - protocol: TCP
          port: 5432
    # In-cluster upstreams and the OTLP collector.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 4317
    # External identity provider and upstreams. Replace the placeholder with
    # the IdP/upstream CIDRs before enabling OAuth; a public issuer is not a
    # pod IP and would otherwise be denied.
    # - to:
    #     - ipBlock:
    #         cidr: 203.0.113.0/24
    #   ports:
    #     - protocol: TCP
    #       port: 443
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
