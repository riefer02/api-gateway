apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway
data:
  APP_ENV: production
  HOST: 0.0.0.0
  PORT: "8080"
  LOG_LEVEL: info
  ADMIN_BIND: 0.0.0.0:9090
  ADMIN_TIMEOUT_SECS: "10"
  AUDIT_RETENTION_DAYS: "90"
  AUTH_CACHE_TTL_SECS: "30"
  UPSTREAM_ALLOW_HOSTS: billing.internal,swapi.dev
  ROUTE_REFRESH_INTERVAL_MS: "2000"
  RATE_LIMIT_BACKEND: local
  RATE_LIMIT_IP_PER_MINUTE: "600"
  RATE_LIMIT_TENANT_PER_MINUTE: "6000"
  CIRCUIT_FAILURE_THRESHOLD: "5"
  CIRCUIT_COOLDOWN_SECS: "30"
  RETRY_MAX_ATTEMPTS: "2"
  RETRY_BASE_DELAY_MS: "50"
  RETRY_BUDGET_RATIO: "0.2"
  REQUEST_TIMEOUT_SECS: "15"
  HEADER_READ_TIMEOUT_SECS: "10"
  MAX_CONNECTIONS: "1024"
  # Your ingress controller's pod CIDR; empty trusts nobody.
  TRUSTED_PROXIES: ""
  MAX_REQUEST_BODY_BYTES: "1048576"
  SHUTDOWN_DRAIN_SECS: "25"
  DB_MAX_CONNECTIONS: "10"
  DB_MIN_CONNECTIONS: "1"
  DB_ACQUIRE_TIMEOUT_SECS: "5"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4317
