services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  gateway:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Forward every documented setting; the explicit entries below win.
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Containers reach Postgres by service name, not loopback.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_PEPPER: ${AUTH_PEPPER:?set AUTH_PEPPER in .env}
      DEV_API_KEY_SECRET: ${DEV_API_KEY_SECRET:-}
      DEV_API_KEY_SCOPES: ${DEV_API_KEY_SCOPES:-read}
      UPSTREAM_ALLOW_HOSTS: ${UPSTREAM_ALLOW_HOSTS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8080:8080"
      # Only useful when ADMIN_TOKENS is set; harmless otherwise.
      - "127.0.0.1:9090:9090"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/api-gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
