x-gateway-base: &gateway-base
  build:
    context: .
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  # Forward every documented setting; the explicit entries below win.
  env_file:
    - .env
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "/usr/local/bin/api-gateway", "healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

x-gateway-env: &gateway-env
  APP_ENV: ${APP_ENV:-development}
  HOST: 0.0.0.0
  PORT: 8080
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Containers reach Postgres by service name, not loopback.
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  # Safe default for local runs: the gateway refuses this value when
  # APP_ENV=production, so a real deployment cannot boot with it.
  AUTH_PEPPER: ${AUTH_PEPPER:-dev-pepper-change-me}
  DEV_API_KEY_SECRET: ${DEV_API_KEY_SECRET:-}
  DEV_API_KEY_SCOPES: ${DEV_API_KEY_SCOPES:-read}
  UPSTREAM_ALLOW_HOSTS: ${UPSTREAM_ALLOW_HOSTS:-}
  ADMIN_TOKENS: ${ADMIN_TOKENS:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  ADMIN_BIND: 0.0.0.0:9090
  # Published ports rewrite the peer address to the bridge gateway, so leave
  # this empty unless you put a proxy on the same Docker network.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  gateway:
    <<: *gateway-base
    environment:
      <<: *gateway-env
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
      # Only useful when ADMIN_TOKENS is set; harmless otherwise.
      - "127.0.0.1:${GATEWAY_ADMIN_PORT:-9090}:9090"

  # Second replica for local convergence tests: `just replicas`.
  # It shares one Postgres, has its own credential cache and rate buckets, and
  # learns about revocations over LISTEN/NOTIFY.
  gateway-b:
    <<: *gateway-base
    profiles: ["replicas"]
    environment:
      <<: *gateway-env
    ports:
      - "127.0.0.1:${GATEWAY_B_PORT:-8081}:8080"
      - "127.0.0.1:${GATEWAY_B_ADMIN_PORT:-9091}:9090"

volumes:
  postgres_data:
