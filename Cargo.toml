[package]
name = "api-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8"
dotenvy = "0.15.7"
getrandom = "0.4.3"
hex = "0.4.3"
opentelemetry = "0.33.1"
opentelemetry-http = "0.33.0"
opentelemetry-otlp = { version = "0.33.1", features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace"] }
reqwest = "0.13.5"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "trace", "timeout", "limit"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

