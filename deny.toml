# cargo-deny policy. Run with `just deny`.
#
# Deny-by-default is the point: a new crate with an unexpected license or an
# open advisory should break the build, not be discovered at release time.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. Add entries deliberately, never as a blanket allow.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    # Mozilla CA bundle data, shipped by webpki-roots.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Workspace crates are not published, so they carry no license expression.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
